name: Publish docs via GitHub Pages
on:
  push:
    branches:
      - main
      
  # Allow the workflow to be triggered also manually.
  workflow_dispatch:
  
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish docs
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push generated docs back to main and gh-pages
      id-token: write # to assume the AWS roles via OIDC
    steps:
      # Assume the release-workflow role first to read the per-repo deploy key from Secrets Manager.
      # The deploy key authorizes the post-doc-gen `git push` back to main under the new automation-bypass ruleset
      # (DeployKey is the sole bypass; default GITHUB_TOKEN would be blocked).
      - name: Configure AWS Credentials (release-workflow role for SM lookup)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.RELEASE_WORKFLOW_ACCESS_TOKEN_ROLE_ARN }}
          aws-region: us-west-2
      - name: Retrieve per-repo deploy key from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            DEPLOY_KEY, prod/devops/aws-dotnet-deploy-deploy-key
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          ssh-key: ${{ env.DEPLOY_KEY }}
      # Re-assume the CI testing-account role; the doc generator calls AWS APIs under this role.
      - name: Configure AWS Credentials (CI testing role for doc generation)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_MAIN_TESTING_ACCOUNT_ROLE_ARN }}
          aws-region: us-west-2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: pip install mkdocs-material==8.2.9
      - run: pip install mkdocs-awesome-pages-plugin==2.8.0
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Run Client Generator
        run: |
          cd ./src/AWS.Deploy.DocGenerator
          dotnet run --project ./AWS.Deploy.DocGenerator.csproj
      - name: Check For Git Untracked Changes
        id: gitcheck
        shell: pwsh
        run: |
          $newFiles=$(git ls-files --others --exclude-standard | wc -l)
          $modifiedFiles=$(git diff --name-only | wc -l)
          "newFiles=$newFiles" >> $env:GITHUB_OUTPUT
          "modifiedFiles=$modifiedFiles" >> $env:GITHUB_OUTPUT
      - name: Commit and Push next version
        if: steps.gitcheck.outputs.newFiles != 0 || steps.gitcheck.outputs.modifiedFiles != 0
        id: commit-push
        run: |
          git config --global user.email "github-aws-sdk-dotnet-automation@amazon.com"
          git config --global user.name "aws-sdk-dotnet-automation"
          git add site/
          git commit -m "Update documentation generated by AWS.Deploy.DocGenerator"
          git push
      - run: mkdocs gh-deploy --force
